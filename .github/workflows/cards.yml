name: Refresh profile cards

on:
  schedule:
    - cron: "17 9 * * *" # daily, ~4am Toronto
  workflow_dispatch:
  push:
    paths:
      - "data/profile.json"
      - "scripts/**"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - name: Render cards
        env:
          # Add a GH_PAT secret (classic token, read:user) to include private contributions.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python scripts/render_cards.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --cached --quiet || git commit -m "Refresh profile cards"
          git push
