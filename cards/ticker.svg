<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="96" viewBox="0 0 1100 96" role="img">
<defs><style>@font-face{font-family:'NS';src:url(data:font/woff;base64,) format('woff');}
.n{font-family:'N','Montserrat','Arial Black',sans-serif;font-weight:700;}
.ns{font-family:'NS','Montserrat',sans-serif;font-weight:600;}
.m{font-family:'M',ui-monospace,Menlo,Consolas,monospace;}
.mb{font-family:'MB',ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
.s{font-family:'S','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.fade{animation:fade .6s ease-out both;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.pulse{animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.2;}}
.blink{animation:blink 1.05s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.neon{animation:neon 2.2s linear both;}
@keyframes neon{0%{opacity:0;}8%{opacity:.9;}10%{opacity:.1;}14%{opacity:1;}16%{opacity:.3;}22%,100%{opacity:1;}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
.tape{animation:tape 3s linear infinite;}.tape2{animation:tape 3s linear infinite reverse;}@keyframes tape{from{transform:translateX(0);}to{transform:translateX(-19.8px);}}</style>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" seed="4"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="vig" cx="50%" cy="40%" r="75%">
<stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#17181e"/><stop offset="1" stop-color="#111216"/></linearGradient>
<pattern id="hazard" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="14" height="14" fill="#08090c"/><rect width="7" height="14" fill="#ff8a1f"/></pattern>
<pattern id="stripes" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="7" height="7" fill="#2a1a0e"/><line x1="0" y1="0" x2="0" y2="7" stroke="#ff8a1f" stroke-width="2.4"/></pattern>
<clipPath id="tclip"><rect x="4" y="4" width="1086" height="82" rx="6"/></clipPath></defs>
<rect x="10" y="10" width="1086" height="82" rx="6" fill="#000" opacity=".85"/>
<g clip-path="url(#tclip)">
<rect x="4" y="4" width="1086" height="82" fill="#08090c"/>
<rect x="4" y="4" width="1126" height="9" fill="url(#hazard)" class="tape"/>
<rect x="-36" y="77" width="1166" height="9" fill="url(#hazard)" class="tape2"/>
<rect x="4" y="4" width="1086" height="82" filter="url(#grain)"/></g>
<text x="48.0" y="53.8" class="ns fade" font-size="25" letter-spacing="5.5" fill="#ff8a1f" style="animation-delay:0.10s">AGENTIC AI</text>
<text x="280.9" y="53.8" class="ns" font-size="25" fill="#5d5a55" text-anchor="middle">/</text>
<text x="314.6" y="53.8" class="ns fade" font-size="25" letter-spacing="5.5" fill="#ff8a1f" style="animation-delay:0.22s">LLMS</text>
<text x="434.5" y="53.8" class="ns" font-size="25" fill="#5d5a55" text-anchor="middle">/</text>
<text x="468.2" y="53.8" class="ns fade" font-size="25" letter-spacing="5.5" fill="#ff8a1f" style="animation-delay:0.34s">BACKEND</text>
<text x="666.6" y="53.8" class="ns" font-size="25" fill="#5d5a55" text-anchor="middle">/</text>
<text x="700.4" y="53.8" class="ns fade" font-size="25" letter-spacing="5.5" fill="#ff8a1f" style="animation-delay:0.46s">SCALABLE SYSTEMS</text>
<rect x="4.75" y="4.75" width="1084.5" height="80.5" rx="6" fill="none" stroke="#2a2b33" stroke-width="1.5"/>
</svg>
